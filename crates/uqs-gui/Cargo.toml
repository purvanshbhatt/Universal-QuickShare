[package]
name = "uqs-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "uqs-gui"
path = "src/main.rs"

[dependencies]
uqs-core = { path = "../uqs-core" }
uqs-phonelink = { path = "../uqs-phonelink" }
uqs-localsend = { path = "../uqs-localsend" }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
notify-rust.workspace = true
iced = { version = "0.14", features = ["tokio", "svg", "qr_code"] }
chrono = "0.4"
ksni = "0.3"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
open = "5"
