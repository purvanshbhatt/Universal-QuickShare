[workspace]
resolver = "2"
members = [
    "crates/uqs-proto",
    "crates/uqs-core",
    "crates/uqs-airdrop",
    "crates/uqs-phonelink",
    "crates/uqs-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1.40", features = ["full"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "arithmetic"] }
mdns-sd = "0.11"
zbus = "4.4"
clap = { version = "4.5", features = ["derive"] }
qrcode = "0.14"
notify-rust = "4.11"
