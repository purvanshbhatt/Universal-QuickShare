syntax = "proto3";
package side_channel.v1;

option csharp_namespace = "YourPhone.YPP.SideChannel.Protocol.V1";
option java_package = "com.microsoft.mmx.agents.ypp.sidechannel.protocol.v1";
option java_multiple_files = true;
option optimize_for = SPEED;

enum SideChannelHotspotRequestType {
    SIDE_CHANNEL_HOTSPOT_REQUEST_TYPE_UNSPECIFIED = 0;
    SIDE_CHANNEL_HOTSPOT_REQUEST_TYPE_CAPABLE_STATUS = 1;
    SIDE_CHANNEL_HOTSPOT_REQUEST_TYPE_CREDENTIALS = 2;
}

enum SideChannelHotspotResponseStatus {
    SIDE_CHANNEL_HOTSPOT_RESPONSE_STATUS_UNSPECIFIED = 0;
    SIDE_CHANNEL_HOTSPOT_RESPONSE_STATUS_SUCCESS = 1;
    SIDE_CHANNEL_HOTSPOT_RESPONSE_STATUS_ERROR_OTHER = 2;
    SIDE_CHANNEL_HOTSPOT_RESPONSE_STATUS_UNTRUSTED = 3;
    SIDE_CHANNEL_HOTSPOT_RESPONSE_STATUS_UNKNOWN_COMMAND = 4;
    SIDE_CHANNEL_HOTSPOT_RESPONSE_STATUS_NOT_HOTSPOT_CAPABLE = 5;
}

enum SideChannelHotspotCapableStatus {
    SIDE_CHANNEL_HOTSPOT_CAPABLE_STATUS_UNSPECIFIED = 0;
    SIDE_CHANNEL_HOTSPOT_CAPABLE_STATUS_UNKNOWN = 1;
    SIDE_CHANNEL_HOTSPOT_CAPABLE_STATUS_SUPPORTED = 2;
    SIDE_CHANNEL_HOTSPOT_CAPABLE_STATUS_AIRPLANE_MODE = 3;
    SIDE_CHANNEL_HOTSPOT_CAPABLE_STATUS_BLOCKED_BY_POLICY = 4;
    SIDE_CHANNEL_HOTSPOT_CAPABLE_STATUS_DATA_NOT_ALLOWED = 5;
    SIDE_CHANNEL_HOTSPOT_CAPABLE_STATUS_DATA_SAVER_IS_ENABLED = 6;
    SIDE_CHANNEL_HOTSPOT_CAPABLE_STATUS_HOTSPOT_PASSWORD_NOT_SET = 7;
    SIDE_CHANNEL_HOTSPOT_CAPABLE_STATUS_NO_HOTSPOT_SUPPORT_ON_PHONE = 8;
    SIDE_CHANNEL_HOTSPOT_CAPABLE_STATUS_SIM_NOT_READY = 9;
    SIDE_CHANNEL_HOTSPOT_CAPABLE_STATUS_SMART_VIEW_IN_USE = 10;
    SIDE_CHANNEL_HOTSPOT_CAPABLE_STATUS_UNSUPPORTED_DATA_PLAN = 11;
    SIDE_CHANNEL_HOTSPOT_CAPABLE_STATUS_WIFI_DIRECT_IN_USE = 12;
    SIDE_CHANNEL_HOTSPOT_CAPABLE_STATUS_WIRELESS_DEX_IN_USE = 13;
    SIDE_CHANNEL_HOTSPOT_CAPABLE_STATUS_LINK_TO_WINDOWS_NOT_TURNED_ON = 14;
    SIDE_CHANNEL_HOTSPOT_CAPABLE_STATUS_BLUETOOTH_PERMISSION_NOT_GRANTED = 15;
    SIDE_CHANNEL_HOTSPOT_CAPABLE_STATUS_HOTSPOT_MANAGER_IS_NULL = 16;
    SIDE_CHANNEL_HOTSPOT_CAPABLE_STATUS_UNKNOWN_MAPPING = 17;
}

message SideChannelHotspotRequest {
    SideChannelHotspotRequestType type = 1;
}

message SideChannelHotspotReservation {
    SideChannelHotspotCapableStatus status = 1;
    string nonce = 3;
}

message SideChannelHotspotResponse {
    SideChannelHotspotResponseStatus status = 1;
    SideChannelHotspotReservation reservation = 2;
    SideChannelHotspotRequestType type = 3; 
}
