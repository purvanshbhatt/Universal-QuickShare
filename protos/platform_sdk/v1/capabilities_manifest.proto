syntax = "proto3";
package platform_sdk.v1;

option csharp_namespace = "YourPhone.YPP.PlatformSdk.Protocol.V1";
option java_package = "com.microsoft.mmx.agents.ypp.platformsdk.protocol.v1";
option java_multiple_files = true;
option optimize_for = SPEED;

message CapabilitiesManifestMessage {
    int32 version = 1;
    int32 min_supported_version = 2;
    repeated string capabilities = 3;
}
